[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ishkeen_ml"
version = "0.1.0"
description = "Dataset-agnostic ML detection pipeline foundation for Ishkeen."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.4.0",
    "Pillow>=10.0.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "onnx>=1.15.0",
    "numpy>=1.26.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
ishkeen-train = "ishkeen_ml.cli:main"
